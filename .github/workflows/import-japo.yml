name: Importar diari del Japó
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-japo.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-japo
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar i verificar la web
        env:
          SOURCE_URL: https://japo-2026-pere.prafols.chatgpt.site
          MANIFEST: 
        run: |
          python3 - <<'PY'
          import os, json, zlib, base64, hashlib, urllib.request, urllib.parse, time
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          files = json.loads(zlib.decompress(base64.b64decode(os.environ['MANIFEST'])))
          root = Path('viaje-web/japo-2026')
          def transfer(item):
              target = root / item['path']
              if target.exists():
                  data = target.read_bytes()
                  sha = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                  if sha == item['sha']: return
              url = os.environ['SOURCE_URL'] + '/' + urllib.parse.quote(item['path'])
              for attempt in range(5):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'JapanTravelImport/1.0'})
                      with urllib.request.urlopen(req, timeout=90) as response: data = response.read()
                      sha = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                      if len(data) != item['bytes'] or sha != item['sha']:
                          raise ValueError('File integrity mismatch: '+item['path'])
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(data)
                      return
                  except Exception:
                      if attempt == 4: raise
                      time.sleep(2 ** attempt)
          with ThreadPoolExecutor(max_workers=6) as pool:
              for index, _ in enumerate(pool.map(transfer, files), 1):
                  if index % 25 == 0: print('Verified',index,'/',len(files),flush=True)
          print('Verified all',len(files),'files; total',sum(x['bytes'] for x in files),'bytes')
          PY
      - name: Guardar el diari al repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viaje-web/japo-2026
          if git diff --cached --quiet; then
            echo "La web ja està actualitzada."
          else
            git commit -m "Afegir Japó 2026 amb 235 fotografies a 2400 px"
            git push origin HEAD:main
          fi
