name: Prepare Japan web photo files
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bake-japan-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bake-japan-web-photos
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Install image processing dependencies
        run: python -m pip install 'Pillow==12.3.0' 'numpy==2.3.5'
      - name: Incorporate the approved adjustments into web JPEGs
        run: python tools/bake-japan-photo-tones.py
      - name: Verify browser filters were removed
        run: node --check viatges-web/japo-2026/app.js
      - name: Publish only the adjusted Japan assets and app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viatges-web/japo-2026/assets viatges-web/japo-2026/app.js viatges-web/japo-2026/photo-adjustments.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Bake approved Japan photo adjustments into 512 web JPEGs"
          git push origin HEAD:main
