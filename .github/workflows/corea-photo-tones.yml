name: Apply approved Korea photo tones
on:
  push:
    branches: [main]
    paths:
      - tools/bake-corea-photo-tones.py
      - viatges-web/corea-2018/photo-tone-plan.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: corea-photo-tones
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /viatges-web/corea-2018/
            /viatges-web/japo-2026/photo-adjustments.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 numpy==2.2.6
      - run: python tools/bake-corea-photo-tones.py
      - name: Save adjusted photographs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viatges-web/corea-2018/fotos viatges-web/corea-2018/photo-adjustments.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aplica els perfils aprovats de llum i color a les 407 fotos de Corea'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
